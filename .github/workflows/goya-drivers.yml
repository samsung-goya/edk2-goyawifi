name: Goya KMDF drivers (Windows 10 19041 WDK, ARM32, test-signed package)

on:
  push:
    paths:
      - 'WinRT/drivers/**'
      - 'WinRT/HalExtMmpTimer/**'
      - 'WinRT/goyaosk/**'
      - 'WinRT/goyacmp/**'
      - 'tools/sign-goya-drivers.ps1'
      - 'tools/make-goyawifi-pkg.py'
      - '.github/workflows/goya-drivers.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        driver: [goyagpio, goyai2c, goyatouch, goyakeys, goyapinmux, goyasdhc, goyabug, goyagpu, goyasdio, goyabatt]
        dir: [WinRT/drivers]
        include:
          - driver: HalExtMmpTimer
            dir: WinRT
    steps:
      - uses: actions/checkout@v4

      - name: Add MSVC ARM (ARM32) build tools to Visual Studio
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Start-Process -Wait -FilePath "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" `
            -ArgumentList "modify --installPath `"$vs`" --add Microsoft.VisualStudio.Component.VC.Tools.ARM --quiet --norestart --noUpdateInstaller"
          "VSINSTALL=$vs" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Install Windows SDK + WDK 10.0.19041 (retrying, no Chocolatey)
        shell: pwsh
        run: ./.github/scripts/install-wdk.ps1

      - name: Build ${{ matrix.driver }}.sys (ARM)
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x86_arm
          set KITS=%ProgramFiles(x86)%\Windows Kits\10
          set DDK_INC_PATH=%KITS%\Include\10.0.19041.0
          set LIB=%KITS%\Lib\10.0.19041.0\km\arm;%LIB%
          if "${{ matrix.driver }}"=="HalExtMmpTimer" (cd WinRT\HalExtMmpTimer && call build.cmd w10 && exit /b 0)
          if "${{ matrix.driver }}"=="goyagpu" (call WinRT\drivers\build-gpu-check.cmd && exit /b 0 || exit /b 1)
          set B=build-kmdf.cmd
          if "${{ matrix.driver }}"=="goyasdhc" set B=build-storport.cmd
          if "${{ matrix.driver }}"=="goyatouch" set B=build-wdm.cmd
          if "${{ matrix.driver }}"=="goyabug" set B=build-wdm.cmd
          if "${{ matrix.driver }}"=="goyasdio" set B=build-wdm.cmd
          call WinRT\drivers\%B% ${{ matrix.driver }}

      - uses: actions/upload-artifact@v4
        if: matrix.driver != 'goyagpu'
        with:
          name: ${{ matrix.driver }}-arm
          path: |
            ${{ matrix.dir }}/${{ matrix.driver }}/${{ matrix.driver }}.sys
            ${{ matrix.dir }}/${{ matrix.driver }}/${{ matrix.driver }}.dll
            ${{ matrix.dir }}/${{ matrix.driver }}/${{ matrix.driver }}.inf
          if-no-files-found: error

  simulators:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: goyasdhc core against the simulated SD host
        run: cc -O1 -Wall -o sdsim tools/sdsim/sim.c && timeout 300 ./sdsim | tail -5
      - name: goyabatt core against the simulated charger, MUIC and PMIC
        run: cc -O1 -Wall -o battsim tools/battsim/sim.c -lm && timeout 300 ./battsim

  goyaosk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (clang, lld, llvm-dlltool, mingw-w64 headers)
        run: sudo apt-get update -q && sudo apt-get install -y -q clang lld llvm mingw-w64-common
      - name: Build goyaosk.exe (ARM32 Thumb-2, no CRT)
        run: |
          bash WinRT/goyaosk/build.sh
          llvm-objdump -d --triple=thumbv7-windows WinRT/goyaosk/out/goyaosk.exe | grep -qE '\b(sdiv|udiv)\b' && { echo 'hardware divide in a Cortex-A9 binary'; exit 1; } || true
      - name: Build goyacmp.exe (WinPE byte compare, ARM32 Thumb-2, no CRT)
        run: |
          bash WinRT/goyacmp/build.sh
          llvm-objdump -d --triple=thumbv7-windows WinRT/goyacmp/out/goyacmp.exe | grep -qE '\b(sdiv|udiv)\b' && { echo 'hardware divide in a Cortex-A9 binary'; exit 1; } || true
          mkdir -p tools-out && cp WinRT/goyaosk/out/goyaosk.exe WinRT/goyacmp/out/goyacmp.exe tools-out/   # one flat folder for the signer
      - uses: actions/upload-artifact@v4
        with:
          name: goyaosk-arm
          path: tools-out/*.exe
          if-no-files-found: error

  goyawifi:
    # Marvell 88W8777 Wi-Fi package: the Surface RT Marvell SDIO driver (14.62.17215.91 ARM) and the SM-T110
    # sd8777 firmware, fetched at pinned commits and checked by SHA-256 in make-goyawifi-pkg.py
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: SDIO core simulator test
        run: cc -O1 -Wall -o /tmp/sdiosim tools/sdiosim/sim.c && /tmp/sdiosim
      - name: Fetch the Marvell driver and the 8777 firmware
        run: |
          git init -q /tmp/mwls97 && git -C /tmp/mwls97 fetch -q --depth 1 https://github.com/DriversStore/mwls97 4d40cd6ce58f27a86aa2f57dd217851d98a82096 && git -C /tmp/mwls97 checkout -q FETCH_HEAD
          git init -q /tmp/vendor && git -C /tmp/vendor fetch -q --depth 1 https://github.com/samsung-goya/android_vendor_samsung_goyawifi be834799df3fba23d85cbb6f14a2a43e328dbaf6 && git -C /tmp/vendor checkout -q FETCH_HEAD
      - name: Build the goyawifi package
        run: python3 tools/make-goyawifi-pkg.py /tmp/mwls97 /tmp/vendor/proprietary/vendor/firmware/mrvl/sd8777_uapsta.bin wifi-out
      - uses: actions/upload-artifact@v4
        with:
          name: goyawifi-arm
          path: wifi-out/*
          if-no-files-found: error

  sign:
    needs: [build, goyaosk, goyawifi]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-arm'
          path: pkg
          merge-multiple: true
      - name: Test-sign drivers, HAL extension and catalogs
        shell: pwsh
        run: |
          ./tools/sign-goya-drivers.ps1 -Dir pkg
          Get-ChildItem pkg | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: goya-drivers-signed
          path: pkg/*
          if-no-files-found: error
      - name: Publish to the signed-drivers branch (main only)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $src = (Resolve-Path pkg).Path
          git config core.autocrlf false
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan signed-drivers
          git rm -rf --quiet .
          git clean -fdxq -e pkg
          Copy-Item "$src\*" . 
          Remove-Item -Recurse -Force pkg
          "Test-signed Goya Windows RT drivers built from $env:GITHUB_SHA (run $env:GITHUB_RUN_ID). Copy everything into the kit's drivers\ folder." | Set-Content README.txt
          # catalogs hash the INFs byte for byte: store every file unchanged (no CRLF->LF)
          Set-Content .gitattributes '* -text' -NoNewline
          git add -A
          git commit -q -m "signed drivers from $env:GITHUB_SHA"
          git push -f origin signed-drivers
